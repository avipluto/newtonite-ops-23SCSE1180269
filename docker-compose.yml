services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ops}
      POSTGRES_DB: ${POSTGRES_DB:-ops}
    ports:
      - "${DB_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  # FastAPI app: runs migrations, seeds demo data (only if empty), serves the API and the React build.
  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ops}:${POSTGRES_PASSWORD:-ops}@db:5432/${POSTGRES_DB:-ops}
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ops}:${POSTGRES_PASSWORD:-ops}@db:5432/ops_test
      TOKEN_TTL_HOURS: ${TOKEN_TTL_HOURS:-12}
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 3s
      retries: 40

  # Background worker: processes the outbox (jobs table) with retries.
  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ops}:${POSTGRES_PASSWORD:-ops}@db:5432/${POSTGRES_DB:-ops}
    depends_on:
      app:
        condition: service_healthy

volumes:
  pgdata:
